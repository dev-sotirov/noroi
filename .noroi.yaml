server:
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s

defaults:
  delay: 0ms
  jitter: 0ms
  status_code: 200
  body_size: 256
  body_type: text
  error_rate: 0.0

metrics:
  enabled: true
  path: /metrics

logging:
  level: info
  format: json

rate_limit:
  enabled: false
  rps: 1000
  burst: 100
