services:
  noroi:
    build: ..
    ports:
      - "8080:8080"
    environment:
      - NOROI_SERVER_PORT=8080
      - NOROI_METRICS_ENABLED=true
      - NOROI_METRICS_PATH=/metrics
      - NOROI_LOGGING_LEVEL=info
      - NOROI_LOGGING_FORMAT=json
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - noroi
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.1+security-01
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/files:ro
    depends_on:
      - noroi
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
